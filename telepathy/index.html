function connectState(){
  const events = new EventSource('/events');
  events.addEventListener('state', ev => receiveState(JSON.parse(ev.data)));
  events.onopen = () => dispatch({ type: 'link', link: 'up' });
  events.onerror = () => dispatch({ type: 'link', link: 'down' });
  getJson('/state').then(receiveState).catch(() => {});
  setInterval(() => { if (!model.set) getJson('/state').then(receiveState).catch(() => {}); }, TUNING.statePollMs);
}

/* live.json: one request in flight at a time, so a slow server can never queue up */
function pollLive(){
  const again = () => setTimeout(pollLive, TUNING.feedPollMs);
  getJson('/live').then(sample => {
    const valid = sample && sample.live !== false && typeof sample.ts === 'number';
    const loud = !!sample && sample.rms > TUNING.heardFloor;
    dispatch({ type: 'live', sample: valid ? sample : null, loud, now: Date.now() });
  }).catch(() => {}).then(again);
}

/* edits: the safety net. /edits restores requests after a reload; /state confirms them if SSE missed a write */
function pollEdits(){
  getJson('/edits').then(edits => dispatch({ type: 'editLog', edits, now: Date.now() })).catch(() => {});
  if (model.pending.length) getJson('/state').then(receiveState).catch(() => {});
}

function postEdit(fields){
  const now = Date.now();
  const id = 'em' + now.toString(36) + Math.random().toString(36).slice(2, 7);
  const edit = composeEdit(fields, model.set, id, now);
  dispatch({ type: 'editSent', edit, now });
  fetch('/edit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(edit) })
    .then(r => r.json())
    .then(reply => { if (!reply || !reply.ok) throw new Error((reply && reply.error) || 'server refused'); })
    .catch(err => dispatch({ type: 'editFailed', edit, reason: err.message, now: Date.now() }));
}

/* ---- pointer input ---- */
const splitKey = key => { const at = key.lastIndexOf('|'); return { layer: key.slice(0, at), step: Number(key.slice(at + 1)) }; };

function onCodeClick(ev){
  const token = ev.target.closest('.t');
  const line = ev.target.closest('.ln');
  if (!token){
    if (line && line.dataset.l) dispatch({ type: 'select', selection: { layer: line.dataset.l, step: null } });
    return;
  }
  const { layer, step } = splitKey(token.dataset.k);
  if (step === MUTE_STEP){ dispatch({ type: 'select', selection: { layer, step: null } }); return; }
  dispatch({ type: 'select', selection: { layer, step } });
  if (model.editMode) openDraft(layer, step, token);
}

function onRackClick(ev){
  const mute = ev.target.closest('[data-mute]');
  if (mute){
    const L = layerById(model.set, mute.dataset.mute);
    if (L) postEdit({ op: 'mute', layer: L.id, muted: !L.muted });
    return;
  }
  const row = ev.target.closest('[data-ch]');
  if (!row) return;
  dispatch({ type: 'select', selection: { layer: row.dataset.ch, step: null } });
  const firstLine = DOM.code.querySelector('.ln[data-l="' + CSS.escape(row.dataset.ch) + '"]');
  if (firstLine) firstLine.scrollIntoView({ block: 'nearest' });
}

/* ---- the edit request form ---- */
let draft = null;
const DRAFT = { box: byId('draft'), title: byId('draftTitle'), text: byId('draftText'), vel: byId('draftVel'), velVal: byId('draftVelVal'), del: byId('draftDelete') };

function openDraft(layerId, step, anchor){
  const L = layerById(model.set, layerId);
  const from = (L.tokens || []).find(t => t.step === step) || null;
  const hint = last(L.tokens || []);
  draft = { layer: layerId, step, from: from && { text: from.text, vel: from.vel } };
  DRAFT.title.textContent = (from ? 'EDIT ' : 'ADD ') + layerId.toUpperCase() + ' STEP ' + step;
  DRAFT.text.value = from ? from.text : hint ? hint.text : '';
  DRAFT.vel.value = from && from.vel != null ? from.vel : 0.8;
  DRAFT.velVal.textContent = Number(DRAFT.vel.value).toFixed(2);
  DRAFT.del.hidden = !from;
  DRAFT.box.hidden = false;
  const r = anchor.getBoundingClientRect();
  DRAFT.box.style.left = clamp(r.left - 40, 8, window.innerWidth - 244) + 'px';
  DRAFT.box.style.top = Math.min(window.innerHeight - 196, r.bottom + 6) + 'px';
  DRAFT.text.focus();
  DRAFT.text.select();
}
function closeDraft(){ DRAFT.box.hidden = true; draft = null; }

function sendDraft(){
  const text = DRAFT.text.value.trim();
  const vel = Number(DRAFT.vel.value);
  const { layer, step, from } = draft;
  const unchanged = from && String(from.text) === text && Math.abs((from.vel || 0) - vel) < 0.005;
  if (!text) dispatch({ type: 'refused', text: 'edit not sent: token text is empty, use DELETE to remove', now: Date.now() });
  else if (!unchanged) postEdit({ op: from ? 'set' : 'add', layer, step, text, vel, from });
  closeDraft();
}
function deleteDraft(){
  const { layer, step, from } = draft;
  postEdit({ op: 'delete', layer, step, from });
  closeDraft();
}

/* Presence is worth noting once a second, not once per mouse pixel. */
function noteInput(){
  const now = Date.now();
  if (now - model.lastInputAt > 1000) dispatch({ type: 'input', now });
}

/* A bonus, never a requirement. Double-clicking a token still selects it. */
function toggleFullscreen(ev){
  if (model.view !== 'stage' || ev.target.closest('.t')) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

function bindInput(){
  DOM.code.addEventListener('click', onCodeClick);
  byId('rack').addEventListener('click', onRackClick);
  document.querySelectorAll('.tab[data-view]').forEach(tab =>
    tab.addEventListener('click', () => dispatch({ type: 'view', view: tab.dataset.view })));
  byId('editToggle').addEventListener('click', () => dispatch({ type: 'editMode' }));
  byId('center').addEventListener('dblclick', toggleFullscreen);
  ['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(kind =>
    window.addEventListener(kind, noteInput, { passive: true }));
  byId('draftSend').addEventListener('click', sendDraft);
  byId('draftDelete').addEventListener('click', deleteDraft);
  byId('draftClose').addEventListener('click', closeDraft);
  DRAFT.vel.addEventListener('input', () => { DRAFT.velVal.textContent = Number(DRAFT.vel.value).toFixed(2); });
  DRAFT.text.addEventListener('keydown', ev => { if (ev.key === 'Enter') sendDraft(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDraft(); });
  document.addEventListener('mousedown', ev => {
    if (!DRAFT.box.hidden && !DRAFT.box.contains(ev.target) && !ev.target.closest('.t')) closeDraft();
  });
}

/* ---- downbeat ---- */
function start(){
  watchCanvas('mini', byId('mini'), 2);
  watchCanvas('spectrum', byId('spectrum'), 2);
  watchCanvas('stage', byId('stageCanvas'), 1.5);
  setHtml(DOM.cliPrompt, promptHtml(null) + CURSOR_HTML, painted.promptMemo);
  DOM.code.innerHTML = lineHtml(plainLine('// waiting for state.json'), 0);
  dispatch({ type: 'input', now: Date.now() });
  bindInput();
  connectState();
  pollLive();
  setInterval(pollEdits, TUNING.editPollMs);
  requestAnimationFrame(frame);
}

start();
</script>
</body>
